name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore TeamsCallRecordsIntegration.sln
      - run: dotnet build --no-restore -c Release TeamsCallRecordsIntegration.sln
      - run: dotnet test --no-build -c Release --verbosity normal TeamsCallRecordsIntegration.sln
